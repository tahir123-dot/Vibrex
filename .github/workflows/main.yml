
name: Deploy Vibrex App on EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted   # <- ye tumhara EC2 hai (runner already registered hai)

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      # ------------------------------------------------------
      # STEP 1: Code checkout
      # ------------------------------------------------------
      # Ye latest pushed code ko runner (EC2) py copy karta hai
      # usi jagah jahan runner install hai (~/actions-runner/_work/...)
      - name: Checkout code
        uses: actions/checkout@v4

      # ------------------------------------------------------
      # STEP 2: Node.js setup
      # ------------------------------------------------------
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
          cache-dependency-path: |
            VibrexBackend/package-lock.json
            Vibrex/package-lock.json

      # ------------------------------------------------------
      # BACKEND
      # ------------------------------------------------------
      - name: Install backend dependencies
        working-directory: ./VibrexBackend
        run: npm ci   # npm ci > npm install: lockfile follow karta hai, faster + reliable

      - name: Create backend .env file
        working-directory: ./VibrexBackend
        run: echo "${{ secrets.PROD_BACKEND_ENV }}" > .env

      - name: Restart backend with PM2
        working-directory: ./VibrexBackend
        run: |
          # 'pm2' command PATH mein hona chahiye (neeche note dekho)
          pm2 delete vibrex-backend || true
          pm2 start index.js --name vibrex-backend
          pm2 save

      # ------------------------------------------------------
      # FRONTEND
      # ------------------------------------------------------
      - name: Install frontend dependencies
        working-directory: ./Vibrex
        run: npm ci

      - name: Create frontend .env file
        working-directory: ./Vibrex
        run: echo "${{ secrets.PROD_FRONTEND_ENV }}" > .env

      - name: Build frontend
        working-directory: ./Vibrex
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: npm run build

      # ------------------------------------------------------
      # DEPLOY FRONTEND TO NGINX
      # ------------------------------------------------------
      - name: Deploy frontend to Nginx
        working-directory: ./Vibrex
        run: |
          if [ ! -d "dist" ]; then
            echo "ERROR: dist folder nahi bani, build fail hua hoga"
            exit 1
          fi
          sudo rsync -av --delete dist/ /var/www/html/
          sudo systemctl restart nginx

      # ------------------------------------------------------
      # HEALTH CHECK (optional but recommended)
      # ------------------------------------------------------
      - name: Verify backend is running
        run: pm2 list